<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Overload</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;600&display=swap" rel="stylesheet">

    <!-- Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Poppins', sans-serif;
        }

        body, html {
            height: 100%;
            color: #fff;
        }

        /* VIDEO BACKGROUND */
        .video-bg {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            z-index: -2;
        }

        /* OVERLAY */
        .overlay {
            position: fixed;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.6);
            z-index: -1;
        }

        /* SPOTIFY EMBED TOP */
        .spotify-embed {
            width: 100%;
            max-width: 500px;
            margin: 20px auto 0;
            padding: 0 15px;
        }

        .spotify-embed iframe {
            width: 100%;
            height: 152px;
            border-radius: 12px;
        }

        /* MAIN CONTENT */
        .container {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            padding-top: 20px;
        }

        h1 {
            font-size: 3rem;
            margin-top: 20px;
        }

        p {
            margin: 10px 0 25px;
            opacity: 0.8;
        }

        /* BUTTON */
        .spotify-btn {
            display: inline-flex;
            align-items: center;
            gap: 10px;
            padding: 12px 25px;
            border-radius: 30px;
            background: #1DB954;
            color: #fff;
            text-decoration: none;
            font-weight: 600;
            transition: 0.3s;
        }

        .spotify-btn:hover {
            transform: scale(1.05);
        }

        /* SOCIALS */
        .socials {
            margin-top: 40px;
            display: flex;
            gap: 20px;
        }

        .socials a {
            color: white;
            font-size: 20px;
            transition: 0.3s;
        }

        .socials a:hover {
            transform: scale(1.3);
            color: #1DB954;
        }

        /* SUBSCRIBE BUTTON (BOTTOM CORNER) */
        .subscribe-btn {
            position: fixed;
            bottom: 20px;
            right: 20px;
            background: #1DB954;
            color: #fff;
            padding: 12px 18px;
            border-radius: 60px;
            font-weight: 600;
            text-decoration: none;
            display: flex;
            align-items: center;
            gap: 8px;
            box-shadow: 0 5px 10px rgba(0,0,0,0.3);
            transition: 0.3s;
            z-index: 9;
        }

        .subscribe-btn:hover {
            transform: scale(1.1);
            background: #1DB954;
        }
    </style>
</head>

<body>
<div class="overlay"></div>

<a href="https://paystack.shop/pay/45wmconzw2" class="subscribe-btn">
    <img src="LOGO.png" alt="logo" style="width:20px; height:20px;">
    Artists
</a>

</body>
</html>
